<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Adoption Application</title>

 
</head>

<body>

  <form>
    <h2>Dog Adoption Application</h2>

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Name">

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" placeholder="Phone Number">

    <label for="address">Address</label>
    <input type="text" id="address" placeholder="Address">

    <div class="checkbox">
      <input
        type="checkbox"
        id="dog"
        value="Have you ever lived with a Dog before?"
      >
      <label for="dog">Have you ever lived with a Dog before?</label>
    </div>

    <label for="breeds">Please select your preferred breeds</label>
    <select id="breeds" multiple>
      <option value="labrador">Labrador</option>
      <option value="golden-retriever">Golden Retriever</option>
      <option value="german-shepherd">German Shepherd</option>
      <option value="beagle">Beagle</option>
    </select>

    <input type="submit" value="Submit">
  </form>

</body>
</html>
